Name: 星叙
Summary: 自编剧情、自定义角色与 AI 共创的文字冒险工坊
Description: |-
  星叙是一款文字冒险平台：离线游玩作者编排的分支剧本，或接入你自己的大模型服务，让 AI 导演与角色陪你即兴共创。

  * 分支剧本完全离线可玩，支持条件、变量、掷骰与多结局
  * AI 导演模式：旁白、角色台词与思考过程分开显示
  * 一句话生成完整剧情与人物，并可一句话修改
  * 分支图与探索进度，成就与彩蛋
  * 液态玻璃界面与可放大折射的透镜底栏
  * 分享码与二维码导入导出，对局可导出为文本
  * 内置全年龄角色与剧情；成人向预设需单独开启
  * 数据仅存本机，AI 请求直连你配置的服务商

  需要 AI 的功能须自行配置 OpenAI 兼容、Anthropic 或 Gemini 协议的服务（也可使用本地 Ollama）。
