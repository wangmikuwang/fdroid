<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>打开分享内容</title>
<style>
  :root {
    --bg: #f5f4f9; --card: #ffffff; --text: #1d1b22; --muted: #625e6c; --line: #e3e0ea;
    --accent: #3d5ba9; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121117; --card: #1c1a22; --text: #ece9f2; --muted: #a8a3b3; --line: #2e2b36;
      --accent: #9fb4ff; --accent-text: #0f1630; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.65 system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 56px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .lead, .note { color: var(--muted); }
  .lead { margin: 0 0 20px; }
  .note { font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; margin-bottom: 16px; }
  .item { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; overflow-wrap: anywhere; }
  .item small { color: var(--muted); }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px;
    background: var(--accent); color: var(--accent-text); font-weight: 600; text-decoration: none; border: 0; font-size: 16px; cursor: pointer; }
  .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .wechat { display: none; border-color: var(--accent); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="title">打开分享内容</h1>
  <p class="lead" id="lead">正在读取分享内容…</p>

  <div class="card wechat" id="wechat">当前页面无法直接打开应用：请点右上角「…」，选择「在浏览器打开」。</div>

  <div class="card" id="preview" hidden></div>

  <div class="card col" id="actions" hidden>
    <a class="btn" id="open" href="#">在应用中打开</a>
    <a class="btn secondary" id="open-other" href="#" hidden></a>
    <button class="btn secondary" id="copy" type="button">复制分享码</button>
    <p class="note" id="copy-note">打不开？复制分享码后打开应用，会自动识别并提示导入。</p>
  </div>

  <div class="card">
    <p style="margin:0 0 8px">还没有安装应用？</p>
    <p class="note" style="margin:0" id="downloads"></p>
  </div>
</main>
<script>
(() => {
  const APPS = {
    hx: { name: '虹叙', scheme: 'hongxu', pkg: 'io.wenyou.textquest.alpha', repo: 'WenYou-TextQuest' },
    xx: { name: '星叙', scheme: 'xingxu', pkg: 'io.wenyou.textquest.beta', repo: 'WenYou-TextQuest-Beta' }
  };
  const $ = (id) => document.getElementById(id);
  const origin = new URLSearchParams(location.search).get('a') === 'hx' ? 'hx' : 'xx';
  const app = APPS[origin];
  const code = (location.hash.slice(1).match(/WY[12]:[A-Za-z0-9_-]{8,}/) || [])[0];
  const fallback = location.href;

  document.title = `用「${app.name}」打开`;
  $('downloads').innerHTML =
    `<a href="https://github.com/wangmikuwang/${app.repo}/releases/latest">从 GitHub 下载「${app.name}」</a>` +
    ` · <a href="../">通过 F-Droid 安装</a>`;

  if (!code) {
    $('lead').textContent = '链接不完整，没有找到分享内容。请让对方重新发送。';
    return;
  }

  const appLink = (a) => /android/i.test(navigator.userAgent)
    ? `intent://import?c=${code}#Intent;scheme=${a.scheme};package=${a.pkg};S.browser_fallback_url=${encodeURIComponent(fallback)};end`
    : `${a.scheme}://import?c=${code}`;
  $('open').href = appLink(app);
  $('open').textContent = `在「${app.name}」中打开`;
  // Content shared from the other app can also be imported here; content from this one cannot go the other way.
  if (origin === 'xx') {
    $('open-other').hidden = false;
    $('open-other').href = appLink(APPS.hx);
    $('open-other').textContent = `已安装「${APPS.hx.name}」？用它打开`;
  }
  $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(code); }
    catch (_) {
      const t = document.createElement('textarea'); t.value = code; document.body.appendChild(t); t.select();
      document.execCommand('copy'); t.remove();
    }
    $('copy-note').textContent = '已复制。打开应用即可看到导入提示。';
  };
  $('actions').hidden = false;
  if (/MicroMessenger|QQ\//i.test(navigator.userAgent)) $('wechat').style.display = 'block';
  $('lead').textContent = `这是一份来自「${app.name}」的分享。`;

  (async () => {
    try {
      let json;
      const b64 = code.slice(4).replace(/-/g, '+').replace(/_/g, '/');
      const bytes = Uint8Array.from(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)), (c) => c.charCodeAt(0));
      if (code.startsWith('WY2:')) {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        json = await new Response(stream).text();
      } else {
        json = new TextDecoder().decode(bytes);
      }
      const data = JSON.parse(json);
      const box = $('preview');
      const add = (emoji, name, kind) => {
        const row = document.createElement('div'); row.className = 'item';
        const label = document.createElement('span'); label.textContent = `${emoji || ''} ${name || '未命名'}`;
        const tag = document.createElement('small'); tag.textContent = kind;
        row.append(label, tag); box.append(row);
      };
      (data.stories || []).forEach((s) => add(s.coverEmoji || '📖', s.title, '剧情'));
      (data.characters || []).forEach((c) => add(c.emoji || '🎭', c.name, '角色'));
      if (box.childElementCount) {
        box.hidden = false;
        const first = (data.stories || [])[0]?.title || (data.characters || [])[0]?.name;
        if (first) $('title').textContent = `《${first}》`;
      }
    } catch (_) { /* Preview is optional; the app validates the code on import. */ }
  })();
})();
</script>
</body>
</html>
